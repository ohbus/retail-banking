<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{common/header :: common-header}" />
<body roleId="page-top" data-spy="scroll" data-target=".navbar-fixed-top">
<head th:replace="~{common/header :: navbar}" />
<div class="container main">
    <div class="row">
        <div class="col-md-6">
            <div class="bg-danger" th:if="${error}" th:text="${error}"></div>
            <form th:action="@{/transfer/toSomeoneElse}" method="post">
                <div class="form-group">
                    <label for="recipientId">1. Please select the recipient you would like to transfer To:</label>
                    <select class="form-control" name="recipientId" id="recipientId" required="required">
                        <option disabled="disabled" th:selected="${recipientId == null}"> -- select a recipient -- </option>
                        <option th:each="recipient : ${recipientList}"
                                th:value="${recipient.id}"
                                th:selected="${recipientId == recipient.id}"
                                th:text="${recipient.name}"></option>
                    </select>
                    <br />
                </div>

                <div class="form-group">
                    <label for="accountType">2. Please select the account you would like to transfer From:</label>
                    <select class="form-control" name="accountType" id="accountType" required="required">
                        <option disabled="disabled" th:selected="${#strings.isEmpty(accountType)}"> -- select your account -- </option>
                        <option th:selected="${accountType == 'Current'}">Current</option>
                        <option th:selected="${accountType == 'Savings'}">Savings</option>
                    </select>
                    <br />
                </div>

                <div class="form-group">
                    <label>3. Please specify the amount you would like to transfer: </label>
                    <span class="input-group-addon">Amount $</span>
                    <input th:value="${amount}" type="text" name="amount" id="amount" class="form-control" aria-label="Amount (to the nearest dollar)" />
                </div>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <button class="btn btn-lg btn-primary btn-block" type="submit">Transfer</button>
            </form>

            <div class="col-md-6">
            </div>
        </div>
    </div>
</div>


<div th:replace="~{common/header :: body-bottom-scripts}" />

</body>
</html>
