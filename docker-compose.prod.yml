services:
  mysql-standalone:
    image: mysql:8
    container_name: mysql-standalone
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bank
      MYSQL_USER: ${MYSQL_USER:-bank_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    networks:
      - spring-app-network

  spring-app:
    build: .
    container_name: spring-app
    restart: unless-stopped
    ports:
      - "9998:9998"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-standalone:3306/bank
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-bank_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      SECURITY_REMEMBER_ME_KEY: ${SECURITY_REMEMBER_ME_KEY:?set SECURITY_REMEMBER_ME_KEY}
    depends_on:
      - mysql-standalone
    networks:
      - spring-app-network

networks:
  spring-app-network:
    driver: bridge
